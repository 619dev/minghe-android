Builds:
  - versionName: 1.0.3
    versionCode: 10003
    commit: v1.0.3
    sudo:
      - echo 'deb https://deb.debian.org/debian forky main' > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm openjdk-21-jdk-headless
      - apt-get install -y build-essential cmake doxygen meson nasm pkgconf python3-pystache yasm
    srclibs:
      - linphone-sdk@8121d3ba2e0e00a3a900d2efc5f2d3e2e235d665
    prebuild:
      - git -C "$$linphone-sdk$$" submodule update --init --recursive
      - python3 scripts/strip-linphone-push.py "$$linphone-sdk$$"
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export ANDROID_HOME="$$SDK$$"
      - export ANDROID_NDK_HOME="$$NDK$$"
      - npm ci --no-audit --no-fund
      - npm run build
      - LINPHONE_SOURCE_DIR="$$linphone-sdk$$" scripts/build-linphone.sh
      - cd android
      - gradle --no-daemon :app:assembleRelease
    ndk: 27.0.12077973
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
