RepoType: git
Repo: https://github.com/619dev/minghe-android.git

Builds:
  - versionName: 1.0.3
    versionCode: 10003
    commit: 8766a5d093333fcb3158aaf93a11960601512e58
    sudo:
      - echo 'deb https://deb.debian.org/debian forky main' > /etc/apt/sources.list.d/forky.list
      - echo 'deb https://deb.debian.org/debian bookworm main' > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - apt-get install -y -t forky nodejs npm openjdk-21-jdk-headless
      - apt-get install -y build-essential cmake doxygen meson nasm pkgconf python3-pystache
        python3-six yasm
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - linphone-sdk-github@8121d3ba2e0e00a3a900d2efc5f2d3e2e235d665
    prebuild:
      - sdk="$$linphone-sdk-github$$"
      - for key in $(git -C "$sdk" config -f .gitmodules --name-only --get-regexp
        '^submodule[.]external/.*[.]url$'); do name=${key#submodule.external/}; name=${name%.url};
        if [ "$name" = ffmpeg ]; then git -C "$sdk" config submodule.external/ffmpeg.update
        none; else git -C "$sdk" config "$key" "https://github.com/a791143125-arch/external-$name.git";
        fi; done
      - git -C "$sdk" config submodule.mscodec2.url https://github.com/BelledonneCommunications/mscodec2.git
      - git -C "$sdk" config submodule.mswebrtc.update none
      - git -C "$sdk" submodule update --init belle-sip
      - git -C "$sdk/belle-sip" config submodule.tester/cpp-httplib.url https://github.com/a791143125-arch/external-cpp-httplib.git
      - git -C "$sdk" submodule update --init --recursive
      - sed -i 's/-DENABLE_WEBRTC=OFF/-DENABLE_WEBRTC_AEC=OFF -DENABLE_WEBRTC_AECM=OFF
        -DENABLE_WEBRTC_VAD=OFF -DENABLE_ILBC=OFF -DENABLE_ISAC=OFF/' scripts/build-linphone.sh
      - sed -i 's|maven { url = uri("../.sdk/maven_repository") }|mavenLocal()|' android/settings.gradle
      - python3 scripts/strip-linphone-push.py "$$linphone-sdk-github$$"
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export ANDROID_HOME="$$SDK$$"
      - export ANDROID_NDK_HOME="$$NDK$$"
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm run build
      - sdk_log=$(mktemp)
      - if JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 LINPHONE_SOURCE_DIR="$$linphone-sdk-github$$"
        scripts/build-linphone.sh 2>&1 | tee "$sdk_log" | awk '/Built target|Build
        files have been written|CMake Error|^FAILURE:/ {print; fflush()}'; then tail
        -n 30 "$sdk_log"; else grep -Ei 'error:|fatal|failed|not found|exception|what
        went wrong' "$sdk_log" | tail -n 80 || true; tail -n 160 "$sdk_log"; exit
        1; fi
      - cd android
      - gradle --no-daemon -Dmaven.repo.local="$PWD/../.sdk/maven_repository" :app:assembleRelease
    ndk: 27.0.12077973

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 1.0.3
CurrentVersionCode: 10003
